[project]
name = "tenantopsbench"
version = "0.1.0"
description = "A small, rigorous benchmark of LLM agents resolving multi-tenant SaaS ops tickets."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pytest>=8",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "openai>=1.30",
]

[project.scripts]
tob = "runner.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "harness*", "runner*", "report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
